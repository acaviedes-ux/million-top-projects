<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Million</title>
  <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
  <link rel="apple-touch-icon" href="/images/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/style.css?v=20260525">
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────────── -->
  <nav class="site-nav">
    <a href="/" class="logo">
      <img src="/images/logo-white.png" alt="MILLION" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span style="display:none">MILLION</span>
    </a>

    <div class="nav-project-logo" id="nav-project-logo">
      <img id="project-logo-img" src="" alt="">
    </div>

    <div class="nav-dropdown" id="nav-dropdown">
      <button class="nav-search-btn" id="nav-dropdown-btn" aria-expanded="false" aria-label="Search projects" title="Search projects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <div class="nav-dropdown-menu" id="nav-dropdown-menu" role="dialog" aria-label="Search projects">
        <div class="nav-dropdown-search">
          <input type="text" id="nav-dropdown-search-input" placeholder="Search projects..." autocomplete="off" aria-label="Search projects">
        </div>
        <div class="nav-dropdown-list" id="nav-dropdown-list" role="listbox"></div>
      </div>
    </div>
  </nav>

  <!-- ── HERO ───────────────────────────────────────────────── -->
  <div class="project-hero-wrap" id="hero-wrap">
    <div class="hero-overlay"></div>
    <div class="hero-logo-wrap" id="hero-logo-wrap" style="display:none">
      <div class="hero-logo-card">
        <img class="hero-logo-img" id="hero-logo-img" src="" alt="" loading="eager">
      </div>
    </div>
  </div>

  <!-- ── BACK BUTTON (below hero, scrolls with page) ────────── -->
  <div class="back-bar">
    <a href="/" class="hero-back">Back</a>
  </div>

  <!-- ── PAGE CONTENT ───────────────────────────────────────── -->
  <div id="page-content">
    <div class="loading">Loading&hellip;</div>
  </div>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="site-footer">&copy; Million Realty LLC</footer>

<script>
(function () {
  'use strict';

  var pageContent = document.getElementById('page-content');
  var heroWrap    = document.getElementById('hero-wrap');
  var slug = window.location.pathname.split('/').filter(Boolean).pop() || '';

  // ── Utilities ────────────────────────────────────────────────

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls)  e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Safe DOM clear — avoids innerHTML = ''
  function clearEl(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ── Dropdown ────────────────────────────────────────────────

  var dropdownBtn    = document.getElementById('nav-dropdown-btn');
  var dropdownMenu   = document.getElementById('nav-dropdown-menu');
  var dropdownList   = document.getElementById('nav-dropdown-list');
  var dropdownInput  = document.getElementById('nav-dropdown-search-input');
  var dropdownLoaded = false;
  var allProjects    = [];

  function openDropdown() {
    dropdownMenu.classList.add('open');
    dropdownBtn.setAttribute('aria-expanded', 'true');
    if (!dropdownLoaded) loadDropdown();
    // Defer focus so the click doesn't immediately blur the input
    setTimeout(function () { dropdownInput.focus(); }, 0);
  }

  function closeDropdown() {
    dropdownMenu.classList.remove('open');
    dropdownBtn.setAttribute('aria-expanded', 'false');
  }

  dropdownBtn.addEventListener('click', function () {
    if (dropdownMenu.classList.contains('open')) {
      closeDropdown();
    } else {
      openDropdown();
    }
  });

  document.addEventListener('click', function (e) {
    if (!document.getElementById('nav-dropdown').contains(e.target)) {
      closeDropdown();
    }
  });

  dropdownInput.addEventListener('input', function () {
    renderDropdownList(dropdownInput.value);
  });

  dropdownInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeDropdown();
      dropdownBtn.focus();
    } else if (e.key === 'Enter') {
      var first = dropdownList.querySelector('.nav-dropdown-item');
      if (first && first.href) window.location.href = first.href;
    }
  });

  function renderDropdownList(query) {
    clearEl(dropdownList);
    var q = (query || '').trim().toLowerCase();
    var filtered = q
      ? allProjects.filter(function(p) {
          return (p.name || '').toLowerCase().indexOf(q) !== -1;
        })
      : allProjects.slice();

    if (!filtered.length) {
      dropdownList.appendChild(el('div', 'nav-dropdown-loading', 'No matches.'));
      return;
    }
    filtered.forEach(function (p) {
      var a = el('a', 'nav-dropdown-item' + (p.slug === slug ? ' active' : ''), p.name);
      a.href = '/projects/' + p.slug;
      a.setAttribute('role', 'option');
      dropdownList.appendChild(a);
    });
  }

  function loadDropdown() {
    dropdownLoaded = true;
    clearEl(dropdownList);
    dropdownList.appendChild(el('div', 'nav-dropdown-loading', 'Loading\u2026'));

    fetch('/api/projects')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        allProjects = (list || []).slice().sort(function (a, b) {
          return (a.name || '').localeCompare(b.name || '');
        });
        renderDropdownList(dropdownInput.value);
      })
      .catch(function () {
        clearEl(dropdownList);
        dropdownList.appendChild(el('div', 'nav-dropdown-loading', 'Could not load.'));
      });
  }

  // ── DOM builders ─────────────────────────────────────────────

  function makeSection(id) {
    var s = el('div', 'page-section');
    if (id) s.id = id;
    return s;
  }

  function toTitleCase(s) {
    if (typeof s !== 'string') return s;
    return s.toLowerCase().replace(/\b([a-z])/g, function (m) { return m.toUpperCase(); });
  }

  function sectionHeading(text) {
    return el('div', 'section-heading', toTitleCase(text));
  }

  // Detail cell: label + value (string, array of lines, or pre-built node)
  function detailCell(label, value, isLeft) {
    var cell = el('div', 'detail-cell' + (isLeft ? ' detail-cell--left' : ''));
    cell.appendChild(el('div', 'detail-label', label));

    var isEmpty = !value || (Array.isArray(value) && !value.length);
    if (isEmpty) {
      cell.appendChild(el('div', 'detail-value detail-empty', '\u2014'));
    } else if (Array.isArray(value)) {
      var ul = el('ul', 'detail-bullets');
      value.forEach(function (line) { ul.appendChild(el('li', null, line)); });
      cell.appendChild(ul);
    } else if (typeof value === 'string') {
      cell.appendChild(el('div', 'detail-value', value));
    } else {
      // Pre-built DOM node (contact card, amenities+parking, etc.)
      cell.appendChild(value);
    }
    return cell;
  }

  function detailRow(leftLabel, leftVal, rightLabel, rightVal) {
    var row = el('div', 'detail-row');
    row.appendChild(detailCell(leftLabel, leftVal, true));
    row.appendChild(detailCell(rightLabel, rightVal, false));
    return row;
  }

  // Returns true if a value counts as "has real data"
  function hasData(val) {
    if (!val) return false;
    if (Array.isArray(val)) return val.length > 0;
    return true;
  }


  // Insert a missing space when a sentence-ending punctuation is glued to the
  // next capitalized word (e.g. "Sq Ft each.This configuration" →
  // "Sq Ft each. This configuration"). Safe by design: only matches the
  // no-space case, so already-spaced phrases like "St. Regis" or "Sq. Ft."
  // are left untouched.
  function normalizeProse(s) {
    if (typeof s !== 'string') return s;
    return s.replace(/([.:;])([A-Z])/g, '$1 $2');
  }

  // Deposit Structure: when the array contains lines ending in ':' (e.g.
  // "Regency Collection:"), treat them as group headers and the lines that
  // follow as that group's bullet list. Falls back to a flat bullet list.
  function buildDepositStructureNode(lines) {
    var hasGroups = lines.some(function (line) { return /:\s*$/.test(line); });
    if (!hasGroups) {
      var flat = el('ul', 'detail-bullets');
      lines.forEach(function (line) { flat.appendChild(el('li', null, line)); });
      return flat;
    }

    var wrap = el('div', 'deposit-groups');
    var currentList = null;
    lines.forEach(function (line) {
      if (/:\s*$/.test(line)) {
        var header = el('div', 'deposit-group-header', line.replace(/:\s*$/, ''));
        wrap.appendChild(header);
        currentList = el('ul', 'detail-bullets');
        wrap.appendChild(currentList);
      } else {
        if (!currentList) {
          currentList = el('ul', 'detail-bullets');
          wrap.appendChild(currentList);
        }
        currentList.appendChild(el('li', null, line));
      }
    });
    return wrap;
  }

  function buildContactNode(contacts) {
    var wrap = el('div', 'contact-list');
    contacts.forEach(function (agent) {
      var entry = el('div', 'contact-entry');
      entry.appendChild(el('div', 'contact-name', agent.name));
      if (agent.phone) entry.appendChild(el('div', 'contact-detail', agent.phone));
      if (agent.email && agent.email.toLowerCase() !== 'n/a') {
        var emailRow = el('div', 'contact-detail');
        var a = el('a', 'contact-email', agent.email);
        a.href = 'mailto:' + agent.email;
        emailRow.appendChild(a);
        entry.appendChild(emailRow);
      }
      wrap.appendChild(entry);
    });
    return wrap;
  }

  // Stylish Amenities cell — includes Parking Spaces as sub-field
  // (buildAmenitiesNode removed \u2014 amenities and parking are now separate grid fields)

  // subtitle (optional) shows a small date or variant label below the title
  function docItem(title, driveFileId, subtitle) {
    var row = el('div', 'doc-item');

    // Preview thumbnail — served by /api/thumb (server-side: thumbnailLink → pdfjs render → SVG)
    if (driveFileId) {
      var previewLink = el('a', 'doc-preview-link');
      previewLink.href   = 'https://drive.google.com/file/d/' + driveFileId + '/view';
      previewLink.target = '_blank';
      previewLink.rel    = 'noopener noreferrer';
      var img = document.createElement('img');
      img.src       = '/api/thumb?id=' + driveFileId;
      img.className = 'doc-preview';
      img.alt       = title || 'Preview';
      img.loading   = 'lazy';
      previewLink.appendChild(img);
      row.appendChild(previewLink);
    } else {
      row.appendChild(el('div', 'doc-preview doc-preview--empty'));
    }

    // Footer: title + optional subtitle (e.g. "As of April, 2026") + action button
    var footer = el('div', 'doc-item-footer');
    if (title)    footer.appendChild(el('div', 'doc-title',    title));
    if (subtitle) footer.appendChild(el('div', 'doc-subtitle', subtitle));
    if (driveFileId) {
      var a = el('a', 'doc-btn', 'View PDF');
      a.href   = 'https://drive.google.com/file/d/' + driveFileId + '/view';
      a.target = '_blank';
      a.rel    = 'noopener noreferrer';
      footer.appendChild(a);
    } else {
      footer.appendChild(el('div', 'doc-pending', 'Coming soon'));
    }
    row.appendChild(footer);

    return row;
  }

  // ── Main render ──────────────────────────────────────────────

  function render(d) {
    document.title = d.name + ' — Million';
    clearEl(pageContent);

    // Project logo — hero (large, centered) + nav (small, scroll-triggered)
    if (d.projectLogo) {
      // Hero logo: always visible over the hero image
      var heroLogoImg  = document.getElementById('hero-logo-img');
      var heroLogoWrap = document.getElementById('hero-logo-wrap');
      heroLogoImg.src  = d.projectLogo;
      heroLogoImg.alt  = d.name;
      heroLogoWrap.style.display = 'flex';

      // Crisp rendering on every screen density:
      // - High-res logos (e.g. St. Regis 10842px): capped to CSS max (440×155)
      // - Low-res logos (e.g. Aria Reserve 323px): capped to naturalWidth/effDpr
      //   effDpr = DPR × 0.75 (min 1) → guarantees ≥1.5 source-px per display-px,
      //   which is still fully sharp while allowing logos to render ~33% larger
      //   than the raw-DPR cap would permit.
      heroLogoImg.onload = function() {
        // SVGs without explicit width/height attrs report naturalWidth = 0.
        // In that case skip the DPR override — CSS max-width/max-height handles sizing.
        if (!this.naturalWidth) return;
        var dpr     = window.devicePixelRatio || 1;
        var effDpr  = Math.max(dpr * 0.75, 1); // 1.5× quality floor on Retina
        // Mirror the CSS constraints: max-width: min(440px, 60vw); max-height: 155px
        var cssMaxW = Math.min(440, window.innerWidth * 0.60);
        var cssMaxH = 155;
        this.style.maxWidth  = Math.min(this.naturalWidth  / effDpr, cssMaxW) + 'px';
        this.style.maxHeight = Math.min(this.naturalHeight / effDpr, cssMaxH) + 'px';
      };

      // Nav logo: only appears once the hero scrolls out of view
      var navLogoImg  = document.getElementById('project-logo-img');
      var navLogoWrap = document.getElementById('nav-project-logo');
      navLogoImg.src  = d.projectLogo;
      navLogoImg.alt  = d.name;

      // Scroll listener: show nav logo when hero bottom clears the nav bar
      function syncNavLogo() {
        var heroBottom = heroWrap.getBoundingClientRect().bottom;
        var navH = document.querySelector('.site-nav').offsetHeight || 60;
        if (heroBottom <= navH) {
          navLogoWrap.classList.add('nav-logo-visible');
        } else {
          navLogoWrap.classList.remove('nav-logo-visible');
        }
      }
      window.addEventListener('scroll', syncNavLogo, { passive: true });
      syncNavLogo(); // run once to set correct state on load
    }

    // Hero image — transparent <a> overlay opens full-res render in new tab
    if (d.hero) {
      var heroImg = el('img', 'hero-img');
      heroImg.src = d.hero;
      heroImg.alt = d.name;
      heroWrap.insertBefore(heroImg, heroWrap.firstChild);

      var heroLink = document.createElement('a');
      heroLink.className = 'hero-link-overlay';
      heroLink.href   = d.hero;
      heroLink.target = '_blank';
      heroLink.rel    = 'noopener noreferrer';
      heroLink.title  = 'Click to view full resolution';
      heroWrap.appendChild(heroLink);
    }

    var frag = document.createDocumentFragment();

    // ── NEW badge ────────────────────────────────────────────
    if (d.isNew) {
      var newBanner = el('div', 'project-new-banner', 'New Project');
      frag.appendChild(newBanner);
    }

    // ── 1. PRICE LIST / PRICE RANGE ──────────────────────────
    (function appendPriceSection() {
      var hasPL    = d.priceList  && d.priceList.driveFileId;
      var hasPR    = d.priceRange && d.priceRange.driveFileId;
      var hasDocs  = Array.isArray(d.priceDocs) && d.priceDocs.length >= 2;

      // Helper: render disclaimer banner if present on any doc.
      // A project may have a disclaimer attached to priceList, priceRange,
      // or to the first doc in priceDocs[] — whichever is present is used.
      // Use case: EDITION Edgewater is range-only, so the disclaimer lives
      // on priceRange. Other projects historically kept it on priceList.
      function appendDisclaimer(sec) {
        var disclaimer =
          (d.priceList  && d.priceList.disclaimer) ||
          (d.priceRange && d.priceRange.disclaimer) ||
          (Array.isArray(d.priceDocs) && d.priceDocs[0] && d.priceDocs[0].disclaimer) ||
          null;
        if (!disclaimer) return;
        var disc = el('div', 'pl-disclaimer pl-disclaimer--' + (disclaimer.type || 'info'));
        var icon = el('span', 'pl-disclaimer-icon');
        icon.textContent = disclaimer.type === 'warning' ? '⚠️' : 'ℹ️';
        disc.appendChild(icon);
        disc.appendChild(el('span', null, disclaimer.text));
        sec.appendChild(disc);
      }

      // Helper: build one card for the multi-doc grid (title + date + iframe).
      // Inline-style approach: we set the critical layout properties directly
      // on the elements via .style.cssText so this works even if the CSS file
      // is cache-stuck on an older version (Vercel CDN, browser cache, etc.).
      // The CSS rules in style.css still apply as a fallback / for theming.
      // Inline styles win over CSS rules, but we still need narrow viewports
      // to use the carousel instead of the 2-up grid. Threshold is 1024px
      // (was 768px — narrower viewports between 769-1023px still don't have
      // room for two readable PDF iframes side-by-side). window.innerWidth
      // is more reliable than matchMedia for some Safari-on-iOS edge cases.
      var isMobile = (window.innerWidth || document.documentElement.clientWidth) <= 1024;

      function buildDocCard(title, driveFileId, dateLabel, totalDocs) {
        var card = el('div', 'pl-doc-card');
        // Desktop with 2+ docs: lock card to 50% (minus gap) so two fit per
        // row. Mobile or 1 doc: 100% so it stacks/fills.
        var cardWidth = (!isMobile && totalDocs >= 2) ? 'calc(50% - 12px)' : '100%';
        // Iframe sizing:
        //   - Desktop multi-doc → aspect-ratio 5/4 (height ~80% of width).
        //     Trying square (1/1) made cards too tall and dominated the
        //     page; 5/4 is 20% shorter while staying landscape-ish.
        //   - Mobile multi-doc → carousel mode shows one card at full
        //     width. Match the single-doc-mobile size (~520px tall) so
        //     each swipeable card reads the same as a single-doc page.
        //   - Single doc (legacy path) → fixed pixel height.
        var iframeSizing;
        if (totalDocs >= 2 && !isMobile) iframeSizing = 'width:100%;aspect-ratio:5/4;';
        else if (totalDocs >= 2)         iframeSizing = 'width:100%;height:520px;';
        else                              iframeSizing = 'width:100%;height:' + (isMobile ? '408px' : '760px') + ';';
        card.style.cssText =
          'flex: 0 0 ' + cardWidth + ';' +
          'max-width: ' + cardWidth + ';' +
          'min-width: 0;' +
          'display: flex;' +
          'flex-direction: column;' +
          'box-sizing: border-box;';
        if (title) {
          var titleEl = el('h4', 'pl-doc-title', title);
          titleEl.style.cssText = 'font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:#000;margin:0 0 6px;';
          card.appendChild(titleEl);
        }
        if (dateLabel) {
          var dateEl = el('p', 'pl-doc-date', dateLabel);
          dateEl.style.cssText = 'font-size:12px;letter-spacing:1px;color:#666;margin:0 0 12px;';
          card.appendChild(dateEl);
        }
        var iframe = document.createElement('iframe');
        iframe.src = 'https://drive.google.com/file/d/' + driveFileId + '/preview';
        iframe.className = 'pl-doc-iframe';
        iframe.setAttribute('allow', 'autoplay');
        iframe.setAttribute('frameborder', '0');
        iframe.style.cssText = iframeSizing + 'border:none;display:block;';
        card.appendChild(iframe);
        return card;
      }

      // Helper: stamp the breakout styles on a section element. Used by both
      // Case 0 (priceDocs[]) and Case A (legacy PL+PR). Inline because the
      // .page-section parent has max-width:1060px and we need to force past
      // that regardless of which CSS revision is loaded.
      // On mobile we skip the breakout (the viewport is narrow enough that
      // the default section width is fine; the transform would only cause
      // a horizontal-scroll glitch).
      function applyWideSectionStyles(sec) {
        sec.classList.add('pl-section--wide');
        if (isMobile) {
          sec.style.cssText = 'padding: 52px 16px;border-top: 1px solid #e5e5e5;text-align: center;';
        } else {
          sec.style.cssText =
            'max-width: none;' +
            'width: min(1400px, calc(100vw - 48px));' +
            'margin-left: 50%;' +
            'margin-right: 0;' +
            'transform: translateX(-50%);' +
            'position: relative;' +
            'padding: 52px 24px;' +
            'border-top: 1px solid #e5e5e5;' +
            'text-align: center;';
        }
      }

      // Helper: build the docs container.
      //   Desktop → flex grid (wrap, gap, centered) — multiple cards visible
      //     at once, max 2 per row enforced by card max-width: calc(50%-12px)
      //   Mobile  → horizontal scroll carousel with snap points + prev/next
      //     arrows. Only one card visible at a time; user swipes or taps
      //     arrows to advance. This mirrors the renderings carousel pattern.
      // Returns the OUTER wrapper to be appended to the section (the carousel
      // version wraps the track in a positioned container so buttons can sit
      // absolutely over the edges).
      function buildDocsContainer(docs, buildCard, fallbackTitlePair) {
        if (!isMobile || docs.length < 2) {
          // Desktop OR single-doc-collapsed-here → simple grid
          var grid = el('div', 'pl-docs-grid');
          grid.style.cssText =
            'display: flex;flex-wrap: wrap;gap: 24px;justify-content: center;' +
            'margin-top: 1rem;width: 100%;box-sizing: border-box;';
          docs.forEach(function (cardData, i) {
            grid.appendChild(buildCard(cardData, docs.length, i));
          });
          return grid;
        }

        // Mobile multi-doc → carousel
        var wrap = el('div', 'pl-docs-carousel-wrap');
        wrap.style.cssText = 'position: relative;margin-top: 1rem;width: 100%;';

        var track = el('div', 'pl-docs-carousel-track');
        track.style.cssText =
          'display: flex;' +
          'gap: 16px;' +
          'overflow-x: auto;' +
          'scroll-snap-type: x mandatory;' +
          '-webkit-overflow-scrolling: touch;' +
          'scrollbar-width: none;' +
          'padding-bottom: 4px;';
        // Hide scrollbar in WebKit (added below as a one-off style tag for
        // ::-webkit-scrollbar pseudo-element since cssText can't set it)
        track.setAttribute('data-no-scrollbar', '1');

        docs.forEach(function (cardData, i) {
          var card = buildCard(cardData, docs.length, i);
          // Override the card width set by buildCard — in carousel mode each
          // card must fill the viewport (100% width with snap-align).
          card.style.flex      = '0 0 100%';
          card.style.maxWidth  = '100%';
          card.style.scrollSnapAlign = 'start';
          track.appendChild(card);
        });
        wrap.appendChild(track);

        // Prev / next arrows — absolute over the edges, paginate one card
        // at a time using scrollBy by the track's client width.
        function makeArrow(label, dir, leftOrRight) {
          var btn = el('button', 'pl-carousel-arrow pl-carousel-arrow--' + leftOrRight);
          btn.textContent = label;
          btn.setAttribute('type', 'button');
          btn.setAttribute('aria-label', leftOrRight === 'left' ? 'Previous' : 'Next');
          btn.style.cssText =
            'position: absolute;' +
            'top: 50%;' +
            'transform: translateY(-50%);' +
            (leftOrRight === 'left' ? 'left: -4px;' : 'right: -4px;') +
            'width: 38px;height: 38px;' +
            'border-radius: 50%;' +
            'border: 1px solid rgba(0,0,0,0.15);' +
            'background: rgba(255,255,255,0.92);' +
            'color: #000;' +
            'font-size: 20px;line-height: 1;' +
            'cursor: pointer;' +
            'display: flex;align-items: center;justify-content: center;' +
            'z-index: 2;' +
            'box-shadow: 0 2px 6px rgba(0,0,0,0.08);' +
            'transition: opacity 0.15s ease;';
          btn.addEventListener('click', function () {
            track.scrollBy({ left: dir * track.clientWidth, behavior: 'smooth' });
          });
          return btn;
        }
        var prevBtn = makeArrow('‹', -1, 'left');
        var nextBtn = makeArrow('›',  1, 'right');
        wrap.appendChild(prevBtn);
        wrap.appendChild(nextBtn);

        // Hide arrows at the ends — once the user has scrolled to the first
        // or last card, the corresponding arrow disappears so they don't
        // wonder why clicking it does nothing. 2px tolerance covers sub-pixel
        // rounding from scroll-snap; without it, atEnd flickered on/off near
        // the boundary. rAF throttle prevents layout thrashing during inertial
        // scroll on touch.
        function updateArrows() {
          var atStart = track.scrollLeft <= 2;
          var atEnd   = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
          prevBtn.style.display = atStart ? 'none' : 'flex';
          nextBtn.style.display = atEnd   ? 'none' : 'flex';
        }
        var scrollPending = false;
        track.addEventListener('scroll', function () {
          if (scrollPending) return;
          scrollPending = true;
          requestAnimationFrame(function () {
            updateArrows();
            scrollPending = false;
          });
        });
        // Initial state: iframes don't affect scrollWidth until they render,
        // but the flex tracks' scrollWidth is already correct from the cards.
        // Run once now (synchronously) and once after rAF in case fonts/iframe
        // shells shift the measurement.
        updateArrows();
        requestAnimationFrame(updateArrows);

        return wrap;
      }

      // ── Case 0: NEW priceDocs[] schema — N iframes ──
      // Layout adapts to viewport (see buildDocsContainer):
      //   desktop → flex grid (max 2 per row)
      //   mobile  → swipeable carousel with prev/next arrows
      if (hasDocs) {
        var sec = makeSection('price-list');
        applyWideSectionStyles(sec);
        sec.appendChild(sectionHeading('PRICE LIST / PRICE RANGE'));
        appendDisclaimer(sec);

        var container = buildDocsContainer(d.priceDocs, function (doc, total) {
          return buildDocCard(doc.title || 'PRICE LIST', doc.driveFileId, doc.createdAt, total);
        });
        sec.appendChild(container);
        frag.appendChild(sec);
        return;
      }

      // ── Case A: legacy PL + PR — same grid/carousel as Case 0 ──
      if (hasPL && hasPR) {
        var sec = makeSection('price-list');
        applyWideSectionStyles(sec);
        sec.appendChild(sectionHeading('PRICE LIST / PRICE RANGE'));
        appendDisclaimer(sec);

        var legacyDocs = [
          { title: 'PRICE LIST',  driveFileId: d.priceList.driveFileId,  createdAt: d.priceList.createdAt  },
          { title: 'PRICE RANGE', driveFileId: d.priceRange.driveFileId, createdAt: d.priceRange.createdAt },
        ];
        var container = buildDocsContainer(legacyDocs, function (doc, total) {
          return buildDocCard(doc.title, doc.driveFileId, doc.createdAt, total);
        });
        sec.appendChild(container);
        frag.appendChild(sec);
        return;
      }

      // ── Case B: single doc (or no data yet) — iframe embed ────────
      // Respect explicit hidden flag on price list
      if (!hasPR && d.priceList && d.priceList.hidden) return;

      // Pick the data object and heading for whichever doc type exists
      var plData    = hasPR ? d.priceRange : (d.priceList || null);
      var plKind    = plData && plData.kind;   // 'mls' | 'ufs' | 'sold-out' | 'paused' | 'message'
      var plHeading = hasPR ? 'PRICE RANGE'
                    : ((d.priceList && d.priceList.heading) || 'PRICE LIST');

      // Special-text cards (MLS, SOLD OUT, PAUSED, custom message):
      // these projects have NO price list and NO link — only a heading.
      // The section heading stays "PRICE LIST" for context; the bold
      // status text is rendered as a banner inside the section.
      var isStatusBanner = plKind === 'mls' || plKind === 'sold-out'
                        || plKind === 'paused' || plKind === 'message'
                        || plKind === 'canceled';

      var sec = makeSection('price-list');
      if (plKind !== 'canceled') {
        sec.appendChild(sectionHeading(isStatusBanner ? 'PRICE LIST' : plHeading));
      }

      // Hybrid (Five Park): button ABOVE the PDF iframe.
      // unitsForSale is a top-level field on the project, independent of
      // priceList — so a project can have BOTH a developer-units PDF and
      // a UFS button that links to the MLS-style site.
      if (d.unitsForSale && d.unitsForSale.externalUrl) {
        var ufsBtn = el('a', 'pl-ext-btn pl-ext-btn--ufs', 'UNITS FOR SALE');
        ufsBtn.href   = d.unitsForSale.externalUrl;
        ufsBtn.target = '_blank';
        ufsBtn.rel    = 'noopener noreferrer';
        sec.appendChild(ufsBtn);
      }

      if (plData && plData.createdAt) {
        sec.appendChild(el('p', 'pl-date', plData.createdAt));
      }

      appendDisclaimer(sec);

      if (isStatusBanner) {
        // Render the heading text as a centered status banner. CSS class
        // pl-status--<kind> lets us style each category distinctly.
        var banner = el('div', 'pl-status pl-status--' + plKind);
        banner.textContent = plHeading;
        sec.appendChild(banner);
      } else if (plData && plData.driveFileId) {
        var iframe = document.createElement('iframe');
        iframe.src = 'https://drive.google.com/file/d/' + plData.driveFileId + '/preview';
        iframe.className = 'pl-iframe';
        iframe.setAttribute('allow', 'autoplay');
        iframe.setAttribute('frameborder', '0');
        sec.appendChild(iframe);
      } else if (plData && plData.externalUrl) {
        // Use the heading as button text — "UNITS FOR SALE" by default for
        // UFS-kind, falls back to the legacy "View All Units for Sale" if
        // no heading is provided.
        var btnText = (plData.heading && plData.heading.trim()) || 'View All Units for Sale';
        var extBtn = el('a', 'pl-ext-btn', btnText);
        extBtn.href   = plData.externalUrl;
        extBtn.target = '_blank';
        extBtn.rel    = 'noopener noreferrer';
        sec.appendChild(extBtn);
      } else if (plData && plData.message) {
        sec.appendChild(el('p', 'pl-message', plData.message));
      } else if (!d.priceList || !d.priceList.heading) {
        var plList = el('div', 'doc-list');
        plList.appendChild(docItem('Price List', null));
        sec.appendChild(plList);
      }

      frag.appendChild(sec);
    }());

    // ── 2. ADDRESS ───────────────────────────────────────────
    if (d.address) {
      var addrSec = makeSection('address');
      addrSec.appendChild(sectionHeading('ADDRESS'));
      var addrLines = (Array.isArray(d.address) ? d.address : d.address.split('\n'))
        .map(function(s) { return s.trim(); }).filter(Boolean);
      var addrP = el('p', 'section-text');
      addrLines.forEach(function(line, i) {
        if (i > 0) addrP.appendChild(document.createElement('br'));
        addrP.appendChild(document.createTextNode(line));
      });
      addrSec.appendChild(addrP);
      frag.appendChild(addrSec);
    }

    // ── 3. DETAILS ───────────────────────────────────────────
    var hasDetails = d.developer || d.architecture || d.interiorDesign ||
      d.completionDate || d.theBuilding || d.depositStructure ||
      d.stylishAmenities || d.parkingSpaces || d.rentalRestrictions ||
      d.hoa || (d.contact && d.contact.length);

    if (hasDetails) {
      var detSec = makeSection('details');
      detSec.appendChild(sectionHeading('DETAILS'));
      var grid = el('div', 'details-grid');

      var contactNode = (d.contact && d.contact.length) ? buildContactNode(d.contact) : null;

      // Build parking node (bullet list) separately from amenities.
      var parkingNode = null;
      if (hasData(d.parkingSpaces)) {
        parkingNode = el('div');
        var pkUl = el('ul', 'detail-bullets');
        d.parkingSpaces.forEach(function (line) { pkUl.appendChild(el('li', null, line)); });
        parkingNode.appendChild(pkUl);
      }

      // Flat ordered list of every field with real data.
      // Fields pair sequentially (two per row). If the total is odd the last
      // field lands alone in a centered full-width row — no special-casing.
      var fields = [];
      if (hasData(d.developer))          fields.push({ label: 'DEVELOPER',           val: d.developer });
      if (hasData(d.architecture))       fields.push({ label: 'ARCHITECTURE',         val: d.architecture });
      if (hasData(d.interiorDesign))     fields.push({ label: 'INTERIOR DESIGN',      val: d.interiorDesign });
      if (hasData(d.completionDate))     fields.push({ label: 'COMPLETION DATE',      val: d.completionDate });
      if (hasData(d.theBuilding))        fields.push({ label: 'THE BUILDING',         val: normalizeProse(d.theBuilding) });
      if (hasData(d.depositStructure)) {
        var depositVal = Array.isArray(d.depositStructure)
          ? buildDepositStructureNode(d.depositStructure)
          : d.depositStructure;
        fields.push({ label: 'DEPOSIT STRUCTURE', val: depositVal });
      }
      if (hasData(d.stylishAmenities))   fields.push({ label: 'STYLISH AMENITIES',    val: normalizeProse(d.stylishAmenities) });
      if (hasData(d.rentalRestrictions)) fields.push({ label: 'RENTAL RESTRICTIONS',  val: d.rentalRestrictions });
      if (parkingNode)                   fields.push({ label: 'PARKING SPACES',       val: parkingNode });
      if (hasData(d.hoa))                fields.push({ label: 'HOA',                  val: d.hoa });
      if (contactNode)                   fields.push({ label: 'CONTACT CARD',         val: contactNode });

      // Render in pairs; last field goes solo + centered when count is odd.
      for (var i = 0; i < fields.length; i += 2) {
        if (i + 1 < fields.length) {
          grid.appendChild(detailRow(fields[i].label, fields[i].val,
                                     fields[i+1].label, fields[i+1].val));
        } else {
          var soloRow = el('div', 'detail-row detail-row--solo');
          soloRow.appendChild(detailCell(fields[i].label, fields[i].val, false));
          grid.appendChild(soloRow);
        }
      }

      detSec.appendChild(grid);
      frag.appendChild(detSec);
    }

    // ── Document sections ────────────────────────────────────
    function appendDocSection(id, title, items) {
      // Skip the section entirely if there are no real documents
      var real = (items || []).filter(function (item) { return item.driveFileId; });
      if (!real.length) return;

      var sec = makeSection(id);
      sec.appendChild(sectionHeading(title));

      // Carousel wrapper — provides anchor for absolutely-positioned arrows
      var wrap = el('div', 'doc-carousel-wrap');
      var list = el('div', 'doc-list');
      real.forEach(function (item) {
        list.appendChild(docItem(item.title, item.driveFileId));
      });
      wrap.appendChild(list);

      // Arrow buttons are added when there are multiple docs.
      // CSS only shows them on mobile; on desktop the grid handles layout.
      if (real.length > 1) {
        wrap.classList.add('has-carousel');

        var prevBtn = el('button', 'doc-carousel-btn doc-carousel-btn--prev');
        prevBtn.textContent = '‹'; // single left angle quotation ‹
        prevBtn.setAttribute('type', 'button');
        prevBtn.setAttribute('aria-label', 'Previous document');
        prevBtn.addEventListener('click', function () {
          var card = list.querySelector('.doc-item');
          list.scrollBy({ left: -(card ? card.offsetWidth + 16 : list.offsetWidth * 0.8), behavior: 'smooth' });
        });

        var nextBtn = el('button', 'doc-carousel-btn doc-carousel-btn--next');
        nextBtn.textContent = '›'; // single right angle quotation ›
        nextBtn.setAttribute('type', 'button');
        nextBtn.setAttribute('aria-label', 'Next document');
        nextBtn.addEventListener('click', function () {
          var card = list.querySelector('.doc-item');
          list.scrollBy({ left: card ? card.offsetWidth + 16 : list.offsetWidth * 0.8, behavior: 'smooth' });
        });

        wrap.appendChild(prevBtn);
        wrap.appendChild(nextBtn);
      }

      sec.appendChild(wrap);
      frag.appendChild(sec);
    }

    // ── 4. Brochures
    appendDocSection('brochures',     'BROCHURES',     d.brochures);
    // ── 5. Fact Sheets
    appendDocSection('fact-sheets',   'FACT SHEETS',   d.factSheets);
    // ── 6. Presentations
    appendDocSection('presentations', 'PRESENTATIONS', d.presentations);
    // ── 7. Floor Plans
    appendDocSection('floor-plans',   'FLOOR PLANS',   d.floorPlans);

    // ── 8. RENDERINGS ────────────────────────────────────────
    if (d.renderings && d.renderings.length) {
      var renderSec = makeSection('renderings');
      renderSec.appendChild(sectionHeading('RENDERINGS'));
      var gallery = el('div', 'renderings-grid');
      d.renderings.forEach(function (r) {
        var img = el('img', 'rendering-img');
        img.alt     = r.alt || '';
        img.loading = 'lazy';

        if (r.driveFileId) {
          img.src = '/api/thumb?id=' + r.driveFileId;
          var a = el('a', 'rendering-link');
          // Files marked tooLarge (>100 MB) can't be served inline by any of
          // Google's CDNs — link directly to the Drive viewer and surface a
          // tooltip explaining why this one render behaves differently.
          if (r.tooLarge) {
            a.classList.add('rendering-link--toolarge');
            a.href  = 'https://drive.google.com/file/d/' + r.driveFileId + '/view';
            a.title = 'Archivo muy pesado. Para descargar, abrir en Drive.';
          } else {
            a.href  = '/api/render?id=' + r.driveFileId;
            a.title = 'Click to view full resolution';
          }
          a.target = '_blank';
          a.rel    = 'noopener noreferrer';
          a.appendChild(img);
          gallery.appendChild(a);
        } else {
          img.src = r.url || '';
          gallery.appendChild(img);
        }
      });
      renderSec.appendChild(gallery);
      frag.appendChild(renderSec);
    }

    pageContent.appendChild(frag);
  }

  // ── Fetch & boot ─────────────────────────────────────────────

  if (!slug) {
    clearEl(pageContent);
    pageContent.appendChild(el('div', 'error-msg', 'No project specified.'));
    return;
  }

  // Silently renew the session cookie on each visit.
  fetch('/api/auth/refresh', { method: 'POST' }).catch(function() {});

  fetch('/api/project?slug=' + encodeURIComponent(slug))
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) { render(data); })
    .catch(function () {
      clearEl(pageContent);
      pageContent.appendChild(el('div', 'error-msg', 'Project not found.'));
    });

}());
</script>
</body>
</html>
