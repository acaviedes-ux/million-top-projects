<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Million</title>
  <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
  <link rel="apple-touch-icon" href="/images/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────────── -->
  <nav class="site-nav">
    <a href="/" class="logo">
      <img src="/images/logo-white.png" alt="MILLION" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span style="display:none">MILLION</span>
    </a>

    <div class="nav-project-logo" id="nav-project-logo">
      <img id="project-logo-img" src="" alt="">
    </div>

    <div class="nav-dropdown" id="nav-dropdown">
      <button class="nav-dropdown-btn" id="nav-dropdown-btn" aria-expanded="false">
        Top Projects <span class="nav-dropdown-arrow">&#9662;</span>
      </button>
      <div class="nav-dropdown-menu" id="nav-dropdown-menu" role="menu"></div>
    </div>
  </nav>

  <!-- ── HERO ───────────────────────────────────────────────── -->
  <div class="project-hero-wrap" id="hero-wrap">
    <div class="hero-overlay"></div>
    <div class="hero-logo-wrap" id="hero-logo-wrap" style="display:none">
      <div class="hero-logo-card">
        <img class="hero-logo-img" id="hero-logo-img" src="" alt="" loading="eager">
      </div>
    </div>
  </div>

  <!-- ── BACK BUTTON (below hero, scrolls with page) ────────── -->
  <div class="back-bar">
    <a href="/" class="hero-back">Back</a>
  </div>

  <!-- ── PAGE CONTENT ───────────────────────────────────────── -->
  <div id="page-content">
    <div class="loading">Loading&hellip;</div>
  </div>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="site-footer">&copy; Million Realty LLC</footer>

<script>
(function () {
  'use strict';

  var pageContent = document.getElementById('page-content');
  var heroWrap    = document.getElementById('hero-wrap');
  var slug = window.location.pathname.split('/').filter(Boolean).pop() || '';

  // ── Utilities ────────────────────────────────────────────────

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls)  e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Safe DOM clear — avoids innerHTML = ''
  function clearEl(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ── Dropdown ────────────────────────────────────────────────

  var dropdownBtn    = document.getElementById('nav-dropdown-btn');
  var dropdownMenu   = document.getElementById('nav-dropdown-menu');
  var dropdownLoaded = false;

  dropdownBtn.addEventListener('click', function () {
    var isOpen = dropdownMenu.classList.toggle('open');
    dropdownBtn.setAttribute('aria-expanded', String(isOpen));
    if (isOpen && !dropdownLoaded) loadDropdown();
  });

  document.addEventListener('click', function (e) {
    if (!document.getElementById('nav-dropdown').contains(e.target)) {
      dropdownMenu.classList.remove('open');
      dropdownBtn.setAttribute('aria-expanded', 'false');
    }
  });

  function loadDropdown() {
    dropdownLoaded = true;
    clearEl(dropdownMenu);
    dropdownMenu.appendChild(el('div', 'nav-dropdown-loading', 'Loading\u2026'));

    fetch('/api/projects')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        clearEl(dropdownMenu);
        list
          .filter(function (p) { return p.section === 'Top Projects'; })
          .forEach(function (p) {
            var a = el('a', 'nav-dropdown-item' + (p.slug === slug ? ' active' : ''), p.name);
            a.href = '/projects/' + p.slug;
            a.setAttribute('role', 'menuitem');
            dropdownMenu.appendChild(a);
          });
      })
      .catch(function () {
        clearEl(dropdownMenu);
        dropdownMenu.appendChild(el('div', 'nav-dropdown-loading', 'Could not load.'));
      });
  }

  // ── DOM builders ─────────────────────────────────────────────

  function makeSection(id) {
    var s = el('div', 'page-section');
    if (id) s.id = id;
    return s;
  }

  function sectionHeading(text) {
    return el('div', 'section-heading', text);
  }

  // Detail cell: label + value (string, array of lines, or pre-built node)
  function detailCell(label, value, isLeft) {
    var cell = el('div', 'detail-cell' + (isLeft ? ' detail-cell--left' : ''));
    cell.appendChild(el('div', 'detail-label', label));

    var isEmpty = !value || (Array.isArray(value) && !value.length);
    if (isEmpty) {
      cell.appendChild(el('div', 'detail-value detail-empty', '\u2014'));
    } else if (Array.isArray(value)) {
      var ul = el('ul', 'detail-bullets');
      value.forEach(function (line) { ul.appendChild(el('li', null, line)); });
      cell.appendChild(ul);
    } else if (typeof value === 'string') {
      cell.appendChild(el('div', 'detail-value', value));
    } else {
      // Pre-built DOM node (contact card, amenities+parking, etc.)
      cell.appendChild(value);
    }
    return cell;
  }

  function detailRow(leftLabel, leftVal, rightLabel, rightVal) {
    var row = el('div', 'detail-row');
    row.appendChild(detailCell(leftLabel, leftVal, true));
    row.appendChild(detailCell(rightLabel, rightVal, false));
    return row;
  }

  // Returns true if a value counts as "has real data"
  function hasData(val) {
    if (!val) return false;
    if (Array.isArray(val)) return val.length > 0;
    return true;
  }


  // Insert a missing space when a sentence-ending punctuation is glued to the
  // next capitalized word (e.g. "Sq Ft each.This configuration" →
  // "Sq Ft each. This configuration"). Safe by design: only matches the
  // no-space case, so already-spaced phrases like "St. Regis" or "Sq. Ft."
  // are left untouched.
  function normalizeProse(s) {
    if (typeof s !== 'string') return s;
    return s.replace(/([.:;])([A-Z])/g, '$1 $2');
  }

  // Deposit Structure: when the array contains lines ending in ':' (e.g.
  // "Regency Collection:"), treat them as group headers and the lines that
  // follow as that group's bullet list. Falls back to a flat bullet list.
  function buildDepositStructureNode(lines) {
    var hasGroups = lines.some(function (line) { return /:\s*$/.test(line); });
    if (!hasGroups) {
      var flat = el('ul', 'detail-bullets');
      lines.forEach(function (line) { flat.appendChild(el('li', null, line)); });
      return flat;
    }

    var wrap = el('div', 'deposit-groups');
    var currentList = null;
    lines.forEach(function (line) {
      if (/:\s*$/.test(line)) {
        var header = el('div', 'deposit-group-header', line.replace(/:\s*$/, ''));
        wrap.appendChild(header);
        currentList = el('ul', 'detail-bullets');
        wrap.appendChild(currentList);
      } else {
        if (!currentList) {
          currentList = el('ul', 'detail-bullets');
          wrap.appendChild(currentList);
        }
        currentList.appendChild(el('li', null, line));
      }
    });
    return wrap;
  }

  function buildContactNode(contacts) {
    var wrap = el('div', 'contact-list');
    contacts.forEach(function (agent) {
      var entry = el('div', 'contact-entry');
      entry.appendChild(el('div', 'contact-name', agent.name));
      if (agent.phone) entry.appendChild(el('div', 'contact-detail', agent.phone));
      if (agent.email && agent.email.toLowerCase() !== 'n/a') {
        var emailRow = el('div', 'contact-detail');
        var a = el('a', 'contact-email', agent.email);
        a.href = 'mailto:' + agent.email;
        emailRow.appendChild(a);
        entry.appendChild(emailRow);
      }
      wrap.appendChild(entry);
    });
    return wrap;
  }

  // Stylish Amenities cell — includes Parking Spaces as sub-field
  // (buildAmenitiesNode removed \u2014 amenities and parking are now separate grid fields)

  // ── Client-side PDF thumbnail renderer ──────────────────────────
  // Uses pdfjs-dist from CDN so no native binary is needed on the server.
  // /api/pdf-proxy authenticates the Drive download; pdfjs uses HTTP range
  // requests so it only fetches the bytes it needs for page 1 (~50-300 KB
  // regardless of total PDF size).

  var _pdfjsLoading = false;
  var _pdfjsReady   = false;
  var _pdfjsQueue   = [];

  function ensurePdfJs(cb) {
    if (_pdfjsReady) { cb(); return; }
    _pdfjsQueue.push(cb);
    if (_pdfjsLoading) return;
    _pdfjsLoading = true;
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js';
    s.onload = function () {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
      _pdfjsReady = true;
      var q = _pdfjsQueue.slice(); _pdfjsQueue = [];
      q.forEach(function (fn) { fn(); });
    };
    s.onerror = function () {
      _pdfjsLoading = false;
      _pdfjsQueue = [];
    };
    document.head.appendChild(s);
  }

  function renderPdfCanvas(canvas) {
    var fileId = canvas.dataset.pdfId;
    ensurePdfJs(function () {
      window.pdfjsLib.getDocument({
        url: '/api/pdf-proxy?id=' + fileId,
        rangeChunkSize: 131072,  // 128 KB chunks — fewer round-trips vs 64 KB default
        disableFontFace: true,
        cMapUrl: null,
        standardFontDataUrl: null,
      }).promise.then(function (pdf) {
        return pdf.getPage(1);
      }).then(function (page) {
        var vp0   = page.getViewport({ scale: 1 });
        var scale = 260 / vp0.width;  // 260px wide — faster render, still sharp enough for thumbnail
        var vp    = page.getViewport({ scale: scale });
        canvas.width  = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return page.render({ canvasContext: ctx, viewport: vp }).promise;
      }).then(function () {
        canvas.classList.add('pdf-ready');
      }).catch(function (err) {
        console.warn('[pdf-thumb] ' + fileId + ':', err.message);
        var empty = el('div', 'doc-preview doc-preview--empty');
        if (canvas.parentNode) canvas.parentNode.replaceChild(empty, canvas);
      });
    });
  }

  function initPdfPreviews() {
    var canvases = document.querySelectorAll('canvas.doc-preview-canvas');
    if (!canvases.length) return;

    // Pre-warm pdfjs-dist immediately — CDN download starts now, in parallel
    // with the user scrolling toward the first card, so the library is ready
    // by the time IntersectionObserver fires for the first canvas.
    ensurePdfJs(function () {});

    if (!window.IntersectionObserver) {
      canvases.forEach(function (c) { renderPdfCanvas(c); });
      return;
    }
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        obs.unobserve(entry.target);
        renderPdfCanvas(entry.target);
      });
    }, { rootMargin: '400px 0px' });
    canvases.forEach(function (c) { obs.observe(c); });
  }

  // subtitle (optional) shows a small date or variant label below the title
  function docItem(title, driveFileId, subtitle) {
    var row = el('div', 'doc-item');

    // Preview thumbnail — canvas rendered client-side via pdfjs-dist
    if (driveFileId) {
      var previewLink = el('a', 'doc-preview-link');
      previewLink.href   = 'https://drive.google.com/file/d/' + driveFileId + '/view';
      previewLink.target = '_blank';
      previewLink.rel    = 'noopener noreferrer';
      var canvas = el('canvas', 'doc-preview-canvas');
      canvas.dataset.pdfId = driveFileId;
      canvas.width  = 260;
      canvas.height = 337;   // ~8.5/11 ratio placeholder while loading
      // Draw initial grey placeholder so the card has correct dimensions immediately
      var ctx0 = canvas.getContext('2d');
      if (ctx0) { ctx0.fillStyle = '#fbfbfb'; ctx0.fillRect(0, 0, 260, 337); }
      previewLink.appendChild(canvas);
      row.appendChild(previewLink);
    } else {
      row.appendChild(el('div', 'doc-preview doc-preview--empty'));
    }

    // Footer: title + optional subtitle (e.g. "As of April, 2026") + action button
    var footer = el('div', 'doc-item-footer');
    if (title)    footer.appendChild(el('div', 'doc-title',    title));
    if (subtitle) footer.appendChild(el('div', 'doc-subtitle', subtitle));
    if (driveFileId) {
      var a = el('a', 'doc-btn', 'View PDF');
      a.href   = 'https://drive.google.com/file/d/' + driveFileId + '/view';
      a.target = '_blank';
      a.rel    = 'noopener noreferrer';
      footer.appendChild(a);
    } else {
      footer.appendChild(el('div', 'doc-pending', 'Coming soon'));
    }
    row.appendChild(footer);

    return row;
  }

  // ── Main render ──────────────────────────────────────────────

  function render(d) {
    document.title = d.name + ' — Million';
    clearEl(pageContent);

    // Project logo — hero (large, centered) + nav (small, scroll-triggered)
    if (d.projectLogo) {
      // Hero logo: always visible over the hero image
      var heroLogoImg  = document.getElementById('hero-logo-img');
      var heroLogoWrap = document.getElementById('hero-logo-wrap');
      heroLogoImg.src  = d.projectLogo;
      heroLogoImg.alt  = d.name;
      heroLogoWrap.style.display = 'flex';

      // Crisp rendering on every screen density:
      // - High-res logos (e.g. St. Regis 10842px): capped to CSS max (440×155)
      // - Low-res logos (e.g. Aria Reserve 323px): capped to naturalWidth/effDpr
      //   effDpr = DPR × 0.75 (min 1) → guarantees ≥1.5 source-px per display-px,
      //   which is still fully sharp while allowing logos to render ~33% larger
      //   than the raw-DPR cap would permit.
      heroLogoImg.onload = function() {
        // SVGs without explicit width/height attrs report naturalWidth = 0.
        // In that case skip the DPR override — CSS max-width/max-height handles sizing.
        if (!this.naturalWidth) return;
        var dpr     = window.devicePixelRatio || 1;
        var effDpr  = Math.max(dpr * 0.75, 1); // 1.5× quality floor on Retina
        // Mirror the CSS constraints: max-width: min(440px, 60vw); max-height: 155px
        var cssMaxW = Math.min(440, window.innerWidth * 0.60);
        var cssMaxH = 155;
        this.style.maxWidth  = Math.min(this.naturalWidth  / effDpr, cssMaxW) + 'px';
        this.style.maxHeight = Math.min(this.naturalHeight / effDpr, cssMaxH) + 'px';
      };

      // Nav logo: only appears once the hero scrolls out of view
      var navLogoImg  = document.getElementById('project-logo-img');
      var navLogoWrap = document.getElementById('nav-project-logo');
      navLogoImg.src  = d.projectLogo;
      navLogoImg.alt  = d.name;

      // Scroll listener: show nav logo when hero bottom clears the nav bar
      function syncNavLogo() {
        var heroBottom = heroWrap.getBoundingClientRect().bottom;
        var navH = document.querySelector('.site-nav').offsetHeight || 60;
        if (heroBottom <= navH) {
          navLogoWrap.classList.add('nav-logo-visible');
        } else {
          navLogoWrap.classList.remove('nav-logo-visible');
        }
      }
      window.addEventListener('scroll', syncNavLogo, { passive: true });
      syncNavLogo(); // run once to set correct state on load
    }

    // Hero image (inserted before the overlay div)
    if (d.hero) {
      var heroImg = el('img', 'hero-img');
      heroImg.src = d.hero;
      heroImg.alt = d.name;
      heroWrap.insertBefore(heroImg, heroWrap.firstChild);
    }

    var frag = document.createDocumentFragment();

    // ── NEW badge ────────────────────────────────────────────
    if (d.isNew) {
      var newBanner = el('div', 'project-new-banner', 'New Project');
      frag.appendChild(newBanner);
    }

    // ── 1. PRICE LIST / PRICE RANGE ──────────────────────────
    (function appendPriceSection() {
      var hasPL = d.priceList  && d.priceList.driveFileId;
      var hasPR = d.priceRange && d.priceRange.driveFileId;

      // Helper: render disclaimer banner if present on priceList
      function appendDisclaimer(sec) {
        var disclaimer = d.priceList && d.priceList.disclaimer;
        if (!disclaimer) return;
        var disc = el('div', 'pl-disclaimer pl-disclaimer--' + (disclaimer.type || 'info'));
        var icon = el('span', 'pl-disclaimer-icon');
        icon.textContent = disclaimer.type === 'warning' ? '⚠️' : 'ℹ️';
        disc.appendChild(icon);
        disc.appendChild(el('span', null, disclaimer.text));
        sec.appendChild(disc);
      }

      // ── Case A: both docs — side-by-side cards + mobile carousel ──
      if (hasPL && hasPR) {
        var sec = makeSection('price-list');
        sec.appendChild(sectionHeading('PRICE LIST / PRICE RANGE'));
        appendDisclaimer(sec);

        var wrap = el('div', 'doc-carousel-wrap');
        wrap.classList.add('has-carousel');
        var list = el('div', 'doc-list');
        list.appendChild(docItem('PRICE LIST',  d.priceList.driveFileId,  d.priceList.createdAt));
        list.appendChild(docItem('PRICE RANGE', d.priceRange.driveFileId, d.priceRange.createdAt));
        wrap.appendChild(list);

        var prevBtn = el('button', 'doc-carousel-btn doc-carousel-btn--prev');
        prevBtn.textContent = '‹';
        prevBtn.setAttribute('type', 'button');
        prevBtn.setAttribute('aria-label', 'Previous');
        prevBtn.addEventListener('click', function () {
          var card = list.querySelector('.doc-item');
          list.scrollBy({ left: -(card ? card.offsetWidth + 16 : list.offsetWidth * 0.8), behavior: 'smooth' });
        });
        var nextBtn = el('button', 'doc-carousel-btn doc-carousel-btn--next');
        nextBtn.textContent = '›';
        nextBtn.setAttribute('type', 'button');
        nextBtn.setAttribute('aria-label', 'Next');
        nextBtn.addEventListener('click', function () {
          var card = list.querySelector('.doc-item');
          list.scrollBy({ left: card ? card.offsetWidth + 16 : list.offsetWidth * 0.8, behavior: 'smooth' });
        });
        wrap.appendChild(prevBtn);
        wrap.appendChild(nextBtn);

        sec.appendChild(wrap);
        frag.appendChild(sec);
        return;
      }

      // ── Case B: single doc (or no data yet) — iframe embed ────────
      // Respect explicit hidden flag on price list
      if (!hasPR && d.priceList && d.priceList.hidden) return;

      // Pick the data object and heading for whichever doc type exists
      var plData    = hasPR ? d.priceRange : (d.priceList || null);
      var plHeading = hasPR ? 'PRICE RANGE'
                    : ((d.priceList && d.priceList.heading) || 'PRICE LIST');

      var sec = makeSection('price-list');
      sec.appendChild(sectionHeading(plHeading));

      if (plData && plData.createdAt) {
        sec.appendChild(el('p', 'pl-date', plData.createdAt));
      }

      appendDisclaimer(sec);

      if (plData && plData.driveFileId) {
        var iframe = document.createElement('iframe');
        iframe.src = 'https://drive.google.com/file/d/' + plData.driveFileId + '/preview';
        iframe.className = 'pl-iframe';
        iframe.setAttribute('allow', 'autoplay');
        iframe.setAttribute('frameborder', '0');
        sec.appendChild(iframe);
      } else if (plData && plData.externalUrl) {
        var extBtn = el('a', 'pl-ext-btn', 'View All Units for Sale');
        extBtn.href   = plData.externalUrl;
        extBtn.target = '_blank';
        extBtn.rel    = 'noopener noreferrer';
        sec.appendChild(extBtn);
      } else if (plData && plData.message) {
        sec.appendChild(el('p', 'pl-message', plData.message));
      } else if (!d.priceList || !d.priceList.heading) {
        var plList = el('div', 'doc-list');
        plList.appendChild(docItem('Price List', null));
        sec.appendChild(plList);
      }

      frag.appendChild(sec);
    }());

    // ── 2. ADDRESS ───────────────────────────────────────────
    if (d.address) {
      var addrSec = makeSection('address');
      addrSec.appendChild(sectionHeading('ADDRESS'));
      addrSec.appendChild(el('p', 'section-text', d.address));
      frag.appendChild(addrSec);
    }

    // ── 3. DETAILS ───────────────────────────────────────────
    var hasDetails = d.developer || d.architecture || d.interiorDesign ||
      d.completionDate || d.theBuilding || d.depositStructure ||
      d.stylishAmenities || d.parkingSpaces || d.rentalRestrictions ||
      d.hoa || (d.contact && d.contact.length);

    if (hasDetails) {
      var detSec = makeSection('details');
      detSec.appendChild(sectionHeading('DETAILS'));
      var grid = el('div', 'details-grid');

      var contactNode = (d.contact && d.contact.length) ? buildContactNode(d.contact) : null;

      // Build parking node (bullet list) separately from amenities.
      var parkingNode = null;
      if (hasData(d.parkingSpaces)) {
        parkingNode = el('div');
        var pkUl = el('ul', 'detail-bullets');
        d.parkingSpaces.forEach(function (line) { pkUl.appendChild(el('li', null, line)); });
        parkingNode.appendChild(pkUl);
      }

      // Flat ordered list of every field with real data.
      // Fields pair sequentially (two per row). If the total is odd the last
      // field lands alone in a centered full-width row — no special-casing.
      var fields = [];
      if (hasData(d.developer))          fields.push({ label: 'DEVELOPER',           val: d.developer });
      if (hasData(d.architecture))       fields.push({ label: 'ARCHITECTURE',         val: d.architecture });
      if (hasData(d.interiorDesign))     fields.push({ label: 'INTERIOR DESIGN',      val: d.interiorDesign });
      if (hasData(d.completionDate))     fields.push({ label: 'COMPLETION DATE',      val: d.completionDate });
      if (hasData(d.theBuilding))        fields.push({ label: 'THE BUILDING',         val: normalizeProse(d.theBuilding) });
      if (hasData(d.depositStructure)) {
        var depositVal = Array.isArray(d.depositStructure)
          ? buildDepositStructureNode(d.depositStructure)
          : d.depositStructure;
        fields.push({ label: 'DEPOSIT STRUCTURE', val: depositVal });
      }
      if (hasData(d.stylishAmenities))   fields.push({ label: 'STYLISH AMENITIES',    val: normalizeProse(d.stylishAmenities) });
      if (hasData(d.rentalRestrictions)) fields.push({ label: 'RENTAL RESTRICTIONS',  val: d.rentalRestrictions });
      if (parkingNode)                   fields.push({ label: 'PARKING SPACES',       val: parkingNode });
      if (hasData(d.hoa))                fields.push({ label: 'HOA',                  val: d.hoa });
      if (contactNode)                   fields.push({ label: 'CONTACT CARD',         val: contactNode });

      // Render in pairs; last field goes solo + centered when count is odd.
      for (var i = 0; i < fields.length; i += 2) {
        if (i + 1 < fields.length) {
          grid.appendChild(detailRow(fields[i].label, fields[i].val,
                                     fields[i+1].label, fields[i+1].val));
        } else {
          var soloRow = el('div', 'detail-row detail-row--solo');
          soloRow.appendChild(detailCell(fields[i].label, fields[i].val, false));
          grid.appendChild(soloRow);
        }
      }

      detSec.appendChild(grid);
      frag.appendChild(detSec);
    }

    // ── Document sections ────────────────────────────────────
    function appendDocSection(id, title, items) {
      // Skip the section entirely if there are no real documents
      var real = (items || []).filter(function (item) { return item.driveFileId; });
      if (!real.length) return;

      var sec = makeSection(id);
      sec.appendChild(sectionHeading(title));

      // Carousel wrapper — provides anchor for absolutely-positioned arrows
      var wrap = el('div', 'doc-carousel-wrap');
      var list = el('div', 'doc-list');
      real.forEach(function (item) {
        list.appendChild(docItem(item.title, item.driveFileId));
      });
      wrap.appendChild(list);

      // Arrow buttons are added when there are multiple docs.
      // CSS only shows them on mobile; on desktop the grid handles layout.
      if (real.length > 1) {
        wrap.classList.add('has-carousel');

        var prevBtn = el('button', 'doc-carousel-btn doc-carousel-btn--prev');
        prevBtn.textContent = '‹'; // single left angle quotation ‹
        prevBtn.setAttribute('type', 'button');
        prevBtn.setAttribute('aria-label', 'Previous document');
        prevBtn.addEventListener('click', function () {
          var card = list.querySelector('.doc-item');
          list.scrollBy({ left: -(card ? card.offsetWidth + 16 : list.offsetWidth * 0.8), behavior: 'smooth' });
        });

        var nextBtn = el('button', 'doc-carousel-btn doc-carousel-btn--next');
        nextBtn.textContent = '›'; // single right angle quotation ›
        nextBtn.setAttribute('type', 'button');
        nextBtn.setAttribute('aria-label', 'Next document');
        nextBtn.addEventListener('click', function () {
          var card = list.querySelector('.doc-item');
          list.scrollBy({ left: card ? card.offsetWidth + 16 : list.offsetWidth * 0.8, behavior: 'smooth' });
        });

        wrap.appendChild(prevBtn);
        wrap.appendChild(nextBtn);
      }

      sec.appendChild(wrap);
      frag.appendChild(sec);
    }

    // ── 4. Brochures
    appendDocSection('brochures',     'BROCHURES',     d.brochures);
    // ── 5. Fact Sheets
    appendDocSection('fact-sheets',   'FACT SHEETS',   d.factSheets);
    // ── 6. Presentations
    appendDocSection('presentations', 'PRESENTATIONS', d.presentations);
    // ── 7. Floor Plans
    appendDocSection('floor-plans',   'FLOOR PLANS',   d.floorPlans);

    // ── 8. RENDERINGS ────────────────────────────────────────
    if (d.renderings && d.renderings.length) {
      var renderSec = makeSection('renderings');
      renderSec.appendChild(sectionHeading('RENDERINGS'));
      var gallery = el('div', 'renderings-grid');
      d.renderings.forEach(function (r) {
        var img = el('img', 'rendering-img');
        img.alt     = r.alt || '';
        img.loading = 'lazy';

        if (r.driveFileId) {
          img.src = '/api/thumb?id=' + r.driveFileId;
          var a = el('a', 'rendering-link');
          a.href   = 'https://drive.google.com/file/d/' + r.driveFileId + '/view';
          a.target = '_blank';
          a.rel    = 'noopener noreferrer';
          a.appendChild(img);
          gallery.appendChild(a);
        } else {
          img.src = r.url || '';
          gallery.appendChild(img);
        }
      });
      renderSec.appendChild(gallery);
      frag.appendChild(renderSec);
    }

    pageContent.appendChild(frag);

    // Activate lazy PDF thumbnail rendering for all doc canvases now in DOM
    initPdfPreviews();
  }

  // ── Fetch & boot ─────────────────────────────────────────────

  if (!slug) {
    clearEl(pageContent);
    pageContent.appendChild(el('div', 'error-msg', 'No project specified.'));
    return;
  }

  fetch('/api/project?slug=' + encodeURIComponent(slug))
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) { render(data); })
    .catch(function () {
      clearEl(pageContent);
      pageContent.appendChild(el('div', 'error-msg', 'Project not found.'));
    });

}());
</script>
</body>
</html>
