name: Sync Price Lists from Drive

# ── Triggers ───────────────────────────────────────────────────────────────────
# • schedule: runs every hour — scans ONLY the current month's folder (fast)
# • workflow_dispatch: manual run from GitHub Actions UI
#   - full_sweep input: set to true to scan ALL historical year/month folders
on:
  schedule:
    - cron: '0 * * * *'   # top of every hour, UTC
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'Scan all historical folders instead of current month only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Only one run at a time — if a run is still going when the next fires, skip it
concurrency:
  group: sync-pricelists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # allows git push
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Hourly / default: only check this month's folder (fast — one API list call)
      - name: Seed price lists — current month
        if: github.event_name == 'schedule' || inputs.full_sweep == 'false'
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          PRICE_LIST_DRIVE_FOLDER_ID: ${{ secrets.PRICE_LIST_DRIVE_FOLDER_ID }}
          PRE_CONSTRUCTION_SPREADSHEET_ID: ${{ secrets.PRE_CONSTRUCTION_SPREADSHEET_ID }}
        run: node scripts/seed-pricelists-from-drive.js --force --current-month

      # Manual full sweep: all year/month folders (use after uploading older PDFs)
      - name: Seed price lists — full sweep
        if: inputs.full_sweep == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          PRICE_LIST_DRIVE_FOLDER_ID: ${{ secrets.PRICE_LIST_DRIVE_FOLDER_ID }}
          PRE_CONSTRUCTION_SPREADSHEET_ID: ${{ secrets.PRE_CONSTRUCTION_SPREADSHEET_ID }}
        run: node scripts/seed-pricelists-from-drive.js --force

      # Refresh createdAt for files modified in Drive without being re-uploaded
      - name: Update price list dates
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_IMPERSONATE_EMAIL: ${{ secrets.GOOGLE_IMPERSONATE_EMAIL }}
        run: node scripts/update-pricelist-dates.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price list changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/projects.json
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: auto-sync price lists from Drive"
          git push
