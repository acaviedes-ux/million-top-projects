name: Sync Price Lists from Drive

# ── Triggers ───────────────────────────────────────────────────────────────────
# • schedule: every 15 min, Mon–Fri, 8 AM–5 PM Colombia time (COT = UTC-5)
#     8:00 AM COT = 13:00 UTC  |  5:00 PM COT = 22:00 UTC
#     cron runs at :00 :15 :30 :45 of each UTC hour 13–22, weekdays only
# • workflow_dispatch: manual run from GitHub Actions UI
on:
  schedule:
    - cron: '*/15 13-22 * * 1-5'   # every 15 min, Mon–Fri, 8 AM–5 PM COT
  workflow_dispatch:

# Only one run at a time — if a run is still going when the next fires, skip it
concurrency:
  group: sync-pricelists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # allows git push
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Seed price docs from each project's "Price Lists" subfolder. This
      # replaces the old central-folder seeder. The seeder is idempotent:
      # it reads whatever is currently in each project's Price Lists folder
      # and writes it to projects.json (single-doc → legacy fields, 2+ docs
      # → priceDocs[] array).
      - name: Seed price lists from project folders
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          # Same folder IDs as sync-docs.yml — hardcoded because they're the
          # canonical project-folder roots (not secret values).
          DOCS_DRIVE_FOLDER_ID: '1OEO2oOrNuIQkmsdnLfJXwObui_CYpGqv'
          EXTRA_DOCS_FOLDER_IDS: '1U0J0ETnBVMgLEcTjOqpsfVA_gF8kz9jF,1XR1IKZ9kz0SNtOYy0PQc1hSzGJ09S7aj'
        run: node scripts/seed-pricelists-from-project-folders.js

      # Refresh createdAt for files modified in Drive without being re-uploaded
      - name: Update price list dates
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_IMPERSONATE_EMAIL: ${{ secrets.GOOGLE_IMPERSONATE_EMAIL }}
        run: node scripts/update-pricelist-dates.js

      # Heal references to files that were trashed in Drive after seeding.
      # End users see "File is in owner's trash" otherwise — silent breakage.
      - name: Heal trashed price list references
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          PRICE_LIST_DRIVE_FOLDER_ID: ${{ secrets.PRICE_LIST_DRIVE_FOLDER_ID }}
        run: node scripts/heal-trashed-pricelists.js

      # Make every Drive file referenced in projects.json publicly readable.
      # Runs unconditionally so newly-seeded files are always accessible —
      # skips files that are already public (idempotent, ~100 ms per file).
      - name: Make Drive files public
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: node scripts/make-drive-files-public.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price list changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/projects.json
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: auto-sync price lists from Drive"
          git pull --rebase origin main
          git push
