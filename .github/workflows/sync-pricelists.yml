name: Sync Price Lists from Drive

# ── Strategy ───────────────────────────────────────────────────────────────────
# GitHub's cron scheduler is unreliable for low-traffic repos (verified: runs
# every 90-120 min instead of the 15 min we ask for). Instead of fighting
# that, we fire ONE master cron per business day and run a self-paced loop
# inside the job — sleep 900s between iterations gives us deterministic
# 15-minute timing under our own control.
#
# Two chained jobs cover the 9-hour business day because GitHub's per-job
# timeout caps at 6 hours. `afternoon: if: always()` ensures it runs even
# if `morning` failed, so a mid-day crash doesn't kill the whole day.
#
# Triggers
# ────────
# • schedule: ONE cron, daily at 8 AM COT (13:00 UTC). GitHub honors this
#   reliably because it's a low-frequency schedule. A second cron at 1 PM
#   COT serves as a safety net in case morning never started.
# • workflow_dispatch: manual run from the Actions UI (also supports
#   external triggers via the GitHub API).
on:
  schedule:
    - cron: '0 13 * * 1-5'  # 8 AM COT — master trigger
    - cron: '0 18 * * 1-5'  # 1 PM COT — backup if morning didn't start
  workflow_dispatch:

# If a daily run is still going when the backup cron fires, skip the backup.
concurrency:
  group: sync-pricelists-daily
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 320  # 5h 20m — covers 8 AM to ~1:20 PM COT
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Stop the loop at this UTC hour. 18 = 1 PM COT — hand off to afternoon.
      END_HOUR_UTC: '18'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync loop (8 AM – 1 PM COT)
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_IMPERSONATE_EMAIL: ${{ secrets.GOOGLE_IMPERSONATE_EMAIL }}
          PRICE_LIST_DRIVE_FOLDER_ID: ${{ secrets.PRICE_LIST_DRIVE_FOLDER_ID }}
          DOCS_DRIVE_FOLDER_ID: '1OEO2oOrNuIQkmsdnLfJXwObui_CYpGqv'
          EXTRA_DOCS_FOLDER_IDS: '1U0J0ETnBVMgLEcTjOqpsfVA_gF8kz9jF,1XR1IKZ9kz0SNtOYy0PQc1hSzGJ09S7aj'
        run: bash .github/scripts/sync-loop.sh

  afternoon:
    needs: morning
    if: always()  # run even if morning crashed — don't lose the back half of the day
    runs-on: ubuntu-latest
    timeout-minutes: 260  # 4h 20m — covers 1 PM to ~5:20 PM COT
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Stop at 22:00 UTC = 5 PM COT — end of business day.
      END_HOUR_UTC: '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync loop (1 PM – 5 PM COT)
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_IMPERSONATE_EMAIL: ${{ secrets.GOOGLE_IMPERSONATE_EMAIL }}
          PRICE_LIST_DRIVE_FOLDER_ID: ${{ secrets.PRICE_LIST_DRIVE_FOLDER_ID }}
          DOCS_DRIVE_FOLDER_ID: '1OEO2oOrNuIQkmsdnLfJXwObui_CYpGqv'
          EXTRA_DOCS_FOLDER_IDS: '1U0J0ETnBVMgLEcTjOqpsfVA_gF8kz9jF,1XR1IKZ9kz0SNtOYy0PQc1hSzGJ09S7aj'
        run: bash .github/scripts/sync-loop.sh
